name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Server syntax check
        run: |
          find server/src server/api -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Secret scan
        run: |
          if git grep -nEI "(mongodb(\+srv)?://[^[:space:]]+:[^[:space:]]+@|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)" -- . ':!*.example' ':!.agent-logs'; then
            echo "Potential secret found in the repository"
            exit 1
          fi
          echo "No committed secrets detected"
