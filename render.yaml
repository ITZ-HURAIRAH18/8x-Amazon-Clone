services:
  - type: web
    name: amazon-clone-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: MONGO_DNS_SERVERS
        value: 8.8.8.8,1.1.1.1,8.8.4.4
      - key: ORDER_STATUS_TOKEN
        generateValue: true
      - key: PRODUCT_ADMIN_TOKEN
        generateValue: true
      # Set these manually, then run `npm run seed:admin` once against the deployed
      # database to create the first administrator account.
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
